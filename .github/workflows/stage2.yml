name: stage2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: environment
        required: true

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_LOGIC_APP_WORKFLOW_NAME: ${{ secrets.TF_LOGIC_APP_WORKFLOW_NAME }}
  TF_RG_NAME: ${{ secrets.TF_RG_NAME }}
  TF_USER_ASSIGNED_IDENTITY_NAME: ${{ secrets.TF_USER_ASSIGNED_IDENTITY_NAME }}

jobs:
  apply:
    runs-on: ubuntu-latest
    # Push events have no input, so they default to sandbox.
    environment: ${{ inputs.environment || 'sandbox' }}
    defaults:
      run:
        working-directory: stage2
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform apply -auto-approve
